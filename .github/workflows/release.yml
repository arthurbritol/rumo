name: Release

# A cada push na main que altera o app, roda os testes, gera o APK e publica uma release nova
# com a lista das alterações desde a release anterior.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core-model/**"
      - "pod-protocol/**"
      - "pod-ble/**"
      - "navigation/**"
      - "trips/**"
      - "maintenance/**"
      - "sync-core/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "version.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publicar release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # histórico e tags completos, para listar as alterações

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Versão
        id: ver
        # version.txt guarda a série (ex.: 0.3). Cada release nova sobe o último número (0.3.1, 0.3.2…); para uma
        # mudança grande, edite version.txt (0.4) e a contagem recomeça em 0.4.1.
        run: |
          SERIES=$(tr -d '[:space:]' < version.txt)
          LAST=$(git tag -l "v${SERIES}.*" | grep -E "^v${SERIES//./\.}\.[0-9]+$" | sed -E 's/.*\.//' | sort -n | tail -1)
          PATCH=$(( ${LAST:-0} + 1 ))
          NAME="${SERIES}.${PATCH}"
          MAJOR=${SERIES%%.*}; MINOR=${SERIES#*.}
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v${NAME}" >> "$GITHUB_OUTPUT"

      - name: Testes
        run: ./gradlew test --console=plain

      - name: Chave de assinatura
        id: sign
        env:
          KS_B64: ${{ secrets.RUMO_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.RUMO_STORE_PASS }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/rumo.keystore"
            echo "RUMO_KEYSTORE=$RUNNER_TEMP/rumo.keystore" >> "$GITHUB_ENV"
            echo "RUMO_STORE_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "fixed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Segredos RUMO_KEYSTORE_B64/RUMO_STORE_PASS ausentes: assinando com chave de debug (cada build terá assinatura diferente)."
            echo "fixed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: APK de release
        env:
          # Camada de trânsito (opcional): variável TRAFFIC_TILE_URL e segredo TRAFFIC_APP_TOKEN do repositório.
          ORG_GRADLE_PROJECT_trafficTileUrl: ${{ vars.TRAFFIC_TILE_URL }}
          ORG_GRADLE_PROJECT_trafficToken: ${{ secrets.TRAFFIC_APP_TOKEN }}
        run: ./gradlew :app:assembleRelease -Prumo.versionCode=${{ steps.ver.outputs.code }} -Prumo.versionName=${{ steps.ver.outputs.name }} --console=plain

      - name: Notas da release
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; SINCE="desde \`$PREV\`"; else RANGE="HEAD"; SINCE="(primeira release)"; fi
          {
            echo "## O que mudou $SINCE"
            echo
            # Cada commit vira um item; o corpo do commit entra como subitens. Ignora trailers e merges.
            for c in $(git rev-list --no-merges $RANGE); do
              echo "- **$(git log -1 --format=%s "$c")**"
              git log -1 --format=%b "$c" | grep -v '^Co-Authored-By:' | sed '/^[[:space:]]*$/d; s/^[[:space:]]*-[[:space:]]*//; s/^/  - /'
            done
            echo
            echo "---"
            echo "Versão ${{ steps.ver.outputs.name }} · commit \`${GITHUB_SHA::7}\`"
            echo
            if [ "${{ steps.sign.outputs.fixed }}" != "true" ]; then
              echo "> Aviso: esta build usa uma chave de assinatura temporária. Se o celular recusar a atualização, desinstale o Rumo antes (os dados do app serão apagados)."
              echo
            fi
            echo "Instale com \`adb install -r Rumo-${{ steps.ver.outputs.tag }}.apk\` ou abra o arquivo no celular (permitindo fontes desconhecidas). O APK atualiza a versão instalada."
          } > notes.md
          cat notes.md

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Rumo-${{ steps.ver.outputs.tag }}.apk"
          gh release create "${{ steps.ver.outputs.tag }}" "Rumo-${{ steps.ver.outputs.tag }}.apk" \
            --target "$GITHUB_SHA" \
            --title "Rumo ${{ steps.ver.outputs.name }}" \
            --notes-file notes.md \
            --latest
