name: Release

# Publica o APK ao criar uma tag no formato v0.3.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test :app:assembleRelease --console=plain
      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk "Rumo-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v3
        with:
          files: Rumo-*.apk
          generate_release_notes: true
