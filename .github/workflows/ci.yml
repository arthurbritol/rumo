name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Testes unitários (JVM)
        run: ./gradlew test --console=plain

      - name: APK de release
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Relatórios de teste
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-de-teste
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

      - name: APK
        uses: actions/upload-artifact@v7
        with:
          name: rumo-apk
          path: app/build/outputs/apk/release/app-release.apk

  regras-firestore:
    name: Regras do Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Testes das regras (emulador)
        run: npx firebase-tools emulators:exec --only firestore --project demo-rumo "npm test"
