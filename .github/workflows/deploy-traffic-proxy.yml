name: Servidor de trânsito

# Publica o servidor intermediário de trânsito (Cloudflare Worker) em workers/traffic-proxy.
# Segredos necessários: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, TOMTOM_KEY, TRAFFIC_APP_TOKEN.
# Sem eles o workflow só roda os testes (passo de publicação é pulado). Passo a passo em docs/TRANSITO.md.

on:
  push:
    branches: [main]
    paths:
      - "workers/traffic-proxy/**"
      - ".github/workflows/deploy-traffic-proxy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Testar e publicar
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.TOMTOM_KEY != '' && secrets.TRAFFIC_APP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Testes do servidor
        working-directory: workers/traffic-proxy
        run: npm test

      - name: Publicar na Cloudflare
        if: env.HAS_SECRETS == 'true'
        uses: cloudflare/wrangler-action@v3
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
          APP_TOKEN: ${{ secrets.TRAFFIC_APP_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/traffic-proxy
          command: deploy
          secrets: |
            TOMTOM_KEY
            APP_TOKEN

      - name: Aviso (segredos ausentes)
        if: env.HAS_SECRETS != 'true'
        run: echo "::warning::Segredos da Cloudflare/TomTom ausentes: servidor de trânsito NÃO foi publicado. Veja docs/TRANSITO.md."
