name: Servidor de trânsito

# Publica o servidor intermediário de trânsito (Cloudflare Worker) em workers/traffic-proxy.
# Segredos necessários: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, TOMTOM_KEY, TRAFFIC_APP_TOKEN.
# Sem eles o workflow só roda os testes (passo de publicação é pulado). Passo a passo em docs/TRANSITO.md.

on:
  push:
    branches: [main]
    paths:
      - "workers/traffic-proxy/**"
      - ".github/workflows/deploy-traffic-proxy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Testar e publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Testes do servidor
        working-directory: workers/traffic-proxy
        run: npm test

      - name: Verificar segredos
        id: sec
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TT_KEY: ${{ secrets.TOMTOM_KEY }}
          APP_TOK: ${{ secrets.TRAFFIC_APP_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ] && [ -n "$TT_KEY" ] && [ -n "$APP_TOK" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Segredos da Cloudflare/TomTom ausentes: servidor de trânsito NÃO foi publicado. Veja docs/TRANSITO.md."
          fi

      - name: Publicar na Cloudflare
        if: steps.sec.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
          APP_TOKEN: ${{ secrets.TRAFFIC_APP_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/traffic-proxy
          command: deploy
          secrets: |
            TOMTOM_KEY
            APP_TOKEN
