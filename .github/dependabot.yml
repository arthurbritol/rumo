version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # Um único PR por mês com o que for seguro atualizar.
    groups:
      dependencias:
        patterns: ["*"]
    ignore:
      # Cadeia de build que sobe junta e exige migração própria: AGP 9.1+, Gradle 9, Kotlin 2.4 (que por sua vez
      # exige kotlinx-serialization 1.12+), compileSdk 37, Compose BOM e core-ktx recentes.
      - dependency-name: "com.android.application"
      - dependency-name: "com.android.library"
      - dependency-name: "com.android.tools.build:gradle"
      - dependency-name: "org.jetbrains.kotlin.*"
      - dependency-name: "com.google.devtools.ksp"
      - dependency-name: "gradle"
      - dependency-name: "androidx.compose:compose-bom"
      - dependency-name: "androidx.core:core-ktx"
      - dependency-name: "androidx.work:work-runtime-ktx"
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization-json"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
